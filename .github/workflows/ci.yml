name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix ui ci
      - name: Typecheck
        run: npx --prefix ui tsc -p ui/tsconfig.app.json --noEmit
      - name: Core tests
        run: cd ui && npx tsx src/pinsela/core/__tests__/run.ts
      - name: Build
        run: npm --prefix ui run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: API tests
        run: cd apps/api && python -m pytest -q
